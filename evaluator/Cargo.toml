[package]
name = "s7-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2", "local_dynamic_tls", "no_thp"] }
cranelift-codegen = "0.133"
cranelift-frontend = "0.133"
cranelift-jit = "0.133"
cranelift-module = "0.133"
cranelift-native = "0.133"
sha2 = { version = "0.10", optional = true }

[features]
mock-records-host = ["dep:sha2"]

[[bin]]
name = "rust_journal_sdk"
path = "src/bin/rust_journal_sdk.rs"
required-features = ["mock-records-host"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
