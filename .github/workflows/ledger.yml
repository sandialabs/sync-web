name: Ledger Binaries

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "journal/**"
      - "records/**"
      - "deploy/bin/ledger/**"
      - "VERSION"
      - "scripts/sync-platform-package-versions.js"
      - ".github/workflows/ledger.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "journal/**"
      - "records/**"
      - "deploy/bin/ledger/**"
      - "VERSION"
      - "scripts/sync-platform-package-versions.js"
      - ".github/workflows/ledger.yml"

concurrency:
  group: "ledger-binaries-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      version_changed: ${{ steps.changes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            version:
              - 'VERSION'
      - name: Read platform version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Check platform package versions
        run: node scripts/sync-platform-package-versions.js

  kernel:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22 and native dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake libclang-dev libzstd-dev llvm-dev wget zlib1g-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y libpolly-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Build and verify current-source AOT
        env:
          LLVM_CONFIG_PATH: /usr/lib/llvm-22/bin/llvm-config
          LIBCLANG_PATH: /usr/lib/llvm-22/lib
        run: |
          out="$GITHUB_WORKSPACE/journal/target/release-kernel"
          scripts/build-wasmer-kernel "$out"
          rm -rf "$out/bundle"
          mkdir "$out/bundle"
          cp "$out"/{builder.txt,cargo.txt,kernel.wasmer,llvm.txt,native-link-libs.sha256,provenance.json,rustc.txt,source.sha256,wasi-clang.txt} "$out/bundle/"
          cp "$out/build/pair-1/kernel.wasm" "$out/bundle/kernel.wasm"
          journal/scripts/check-wasmer-kernel-provenance.py "$out/bundle" "$GITHUB_SHA"
          echo "Wasmer AOT SHA-256: $(sha256sum "$out/kernel.wasmer" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-qualified-wasmer-kernel
          path: journal/target/release-kernel/bundle/
          if-no-files-found: error

  build:
    needs: [metadata, kernel]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both release paths use the same qualified Linux/x86_64 AOT.
          - variant: glibc
            target: linux-x86_64
          - variant: musl
            target: linux-x86_64-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ledger-qualified-wasmer-kernel
          path: target/qualified-kernel
      - name: Build provenance-locked ${{ matrix.variant }} release builder
        run: |
          journal/scripts/check-wasmer-kernel-provenance.py target/qualified-kernel "$GITHUB_SHA"
          cp target/qualified-kernel/kernel.wasmer journal/kernel.wasmer
          aot_sha=$(sha256sum journal/kernel.wasmer | awk '{print $1}')
          inputs_sha=$( \
            (git ls-files -z | sort -z | xargs -0 sha256sum; \
             sha256sum journal/kernel.wasmer) | sha256sum | awk '{print $1}' \
          )
          docker build --pull --target builder \
            --build-arg TARGETARCH=amd64 \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --build-arg SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
            --build-arg SOURCE_INPUTS_SHA256="$inputs_sha" \
            --build-arg AOT_SHA256="$aot_sha" \
            -f journal/Dockerfile.${{ matrix.variant }} \
            -t sync-web-ledger-builder:${{ matrix.variant }} .
      - name: Smoke binaries with the matching runtime and qualified AOT
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e SYNC_WEB_INTERFACE_SECRET=release-smoke-interface \
            sync-web-ledger-builder:${{ matrix.variant }} -ec '
              /tmp/journal-sdk --version
              test "$(/tmp/journal-sdk --evaluate "(+ 1 2)")" = 3
              /tmp/ledger --version
              test "$(/tmp/ledger --database /tmp/ledger-smoke/db \
                --secret release-smoke-root \
                --evaluate "((function size) (arguments ()))")" = 0
            '
      - name: Extract binaries and qualified AOT
        run: |
          mkdir -p dist
          container=$(docker create sync-web-ledger-builder:${{ matrix.variant }})
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/tmp/journal-sdk" "dist/journal-sdk-${{ matrix.target }}"
          docker cp "$container:/tmp/ledger" "dist/ledger-${{ matrix.target }}"
          cp target/qualified-kernel/kernel.wasmer "dist/kernel-${{ matrix.target }}.wasmer"
          cp target/qualified-kernel/provenance.json "dist/kernel-${{ matrix.target }}.provenance.json"
          docker rm -f "$container" >/dev/null
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main' && needs.metadata.outputs.version_changed == 'true'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ledger-binaries-*
          path: release-artifacts
          merge-multiple: true

      - name: Check release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ledger-v${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release $RELEASE_TAG already points at $tag_sha, not this commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ledger-v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ledger ${{ needs.metadata.outputs.version }}
          body: |
            Ledger and journal-sdk binary artifacts for Sync Web ${{ needs.metadata.outputs.version }}.

            Source commit: ${{ github.sha }}
          make_latest: true
          files: release-artifacts/*
