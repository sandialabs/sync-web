name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cm-super \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            texlive-plain-generic \
            texlive-science
      - name: Build whitepaper PDF
        run: |
          make -C docs/whitepaper
          test -s docs/whitepaper/whitepaper.pdf
          install -m 0644 docs/whitepaper/whitepaper.pdf docs/info/public/whitepaper.pdf
          test -s docs/info/public/whitepaper.pdf
      - name: Install packages
        working-directory: docs/info
        run: npm ci
      - name: Create documents
        working-directory: docs/info
        run: npm run build
      - name: Upload documents artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/info/dist/'
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
