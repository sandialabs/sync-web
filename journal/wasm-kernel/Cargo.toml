[package]
name = "sync-web-evaluator-kernel"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "../src/lib.rs"
crate-type = ["staticlib"]

[features]
default = ["wasm-kernel"]
wasm-kernel = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("test-support", "wasmer-evaluator"))'] }

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
hex = "0.4.3"
once_cell = "1.19.0"
rand = "0.8.5"
sha2 = "0.10.8"
libc = "0.2"
log = "0.4.21"
crystals-dilithium = "1.0.0"
pqcrypto = { version = "0.17.0", default-features = false }
serde_json = "1.0.149"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.0.83"
sha2 = "0.10.8"

[profile.release]
lto = true
codegen-units = 1
