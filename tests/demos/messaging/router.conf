server {
    listen 80;
    server_name localhost;
    # Preserve the browser-facing port instead of nginx's internal port 80.
    absolute_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = / { return 302 /messenger/; }
    location = /metrics { return 404; }
    location /api/ { proxy_pass http://gateway; }
    location /auth/ { proxy_pass http://gateway; }
    location = /gateway { proxy_pass http://gateway/; }
    location = /gateway-logo.png { proxy_pass http://gateway/gateway-logo.png; }
    location = /healthz { proxy_pass http://gateway/healthz; }
    location = /readyz { proxy_pass http://gateway/readyz; }
    location /explorer/ { proxy_pass http://explorer/; }
    location = /explorer { return 302 /explorer/; }
    location /messenger/ { proxy_pass http://messenger:8280/; }
    location = /messenger { return 302 /messenger/; }
}
